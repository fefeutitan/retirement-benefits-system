spring:
  application:
    name: beneficios-online-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:beneficios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  aws:
    enabled: ${APP_AWS_ENABLED:false}
    region: ${AWS_REGION:sa-east-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    sns-topic-arn: ${AWS_SNS_TOPIC_ARN:}
    sqs-queue-url: ${AWS_SQS_QUEUE_URL:}
    consumer-delay-ms: ${AWS_CONSUMER_DELAY_MS:2000}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beneficios}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
